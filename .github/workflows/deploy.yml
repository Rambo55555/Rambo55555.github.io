name: Deploy al-folio

on:
  push:
    branches: [main, al-folio-redesign]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install --upgrade nbconvert

      - name: Build
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Preserve static site marker
        run: touch _site/.nojekyll

      - name: Inline profile photo
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          page = Path('_site/index.html')
          html = page.read_text()
          b64 = Path('assets/img/prof_pic_inline.b64').read_text().strip()
          replacement = (
              '<img src="data:image/jpeg;base64,' + b64 + '" '
              'class="img-fluid z-depth-1 rounded" width="100%" height="auto" '
              'alt="Rambo profile photo" loading="eager">'
          )

          html, count = re.subn(
              r'<picture>.*?<img[^>]*src="/assets/img/prof_pic\.jpg[^>]*>.*?</picture>',
              replacement,
              html,
              count=1,
              flags=re.S,
          )
          if count == 0:
              html, count = re.subn(
                  r'<img[^>]*src="/assets/img/prof_pic\.jpg[^>]*>',
                  replacement,
                  html,
                  count=1,
              )
          if count != 1:
              raise SystemExit(f'Expected exactly one profile image replacement, got {count}')

          page.write_text(html)
          PY

      - name: Keep public favicon URL
        run: |
          find _site -name '*.html' -type f -print0 | xargs -0 sed -E -i 's#href="/assets/img/favicon\.png\?v=[^"]+"#href="https://rambo55555.github.io/wiki/images/favicon.png"#g'

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
